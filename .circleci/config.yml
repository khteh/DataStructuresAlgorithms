version: 2.1
orbs:
  aws-cli: circleci/aws-cli@5.4.1
  slack: circleci/slack@6.1.3

executors:
  node:
    docker:
      - image: khteh/ubuntu:latest

references:
  workspace_root: &workspace_root ~/workspace

  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

defaults: &defaults # Default directory to run the steps in.
  working_directory: *workspace_root

jobs:
  build_and_test:
    <<: *defaults
    docker:
      - image: khteh/ubuntu:latest
    steps:
      - checkout:
          method: full
      - run: cmake -S . -B build --config Release --target all --
      # • CircleCI automatically monitors the exit status of every line in a command block. When it intercepts the 42 code, it immediately halts the build and marks the step as failed.
      - run: valgrind --leak-check=full --error-exitcode=42 --log-file=console.log Release/Console
      - run: valgrind --leak-check=full --error-exitcode=42 --log-file=tests.log Release/DataStructuresAlgorithms.Tests
      - persist_to_workspace:
          name: Save Workspace
          root: .
          paths:
            - console.log
            - tests.log
  deploy-eks:
    executor: aws-cli/default
    <<: *defaults
    steps:
      - *attach_workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          profile-name: default
      - run:
          name: Use the saved build number here
          command: |
            echo 'export CIRCLE_BUILD_NUM_DOCKER="$(cat /tmp/docker-build_number.txt)"' >> $BASH_ENV
            . $BASH_ENV
            echo CIRCLE_BUILD_NUM_DOCKER: $CIRCLE_BUILD_NUM_DOCKER
      - run:
          name: Update Application
          command: |
            #kubectl patch statefulset aspnetcorewebapi --type='json' -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/image", "value":"'$AWS_ACCOUNT_ID'.dkr.ecr.ap-southeast-1.amazonaws.com/aspnetcorewebapi:'$CIRCLE_BUILD_NUM_DOCKER'"}]'
            kubectl set image sts/aspnetcorewebapi aspnetcorewebapi=$AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/aspnetcorewebapi:$CIRCLE_BUILD_NUM_DOCKER
  notification:
    docker:
      - image: "cimg/base:stable"
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS # context / project UI env-var reference
    steps:
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1

workflows:
  main:
    jobs:
      - build_and_test
